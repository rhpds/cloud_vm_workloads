---
# -------------------------------------------------------------------------
# To Do: Implement your workload deployment tasks here
# -------------------------------------------------------------------------

- set_fact:
    r_openshift_cnv_instances: []

- name: Create instances, services and routes
  module_defaults:
    group/k8s:
      host: "{{ sandbox_openshift_api_url }}"
      api_key: "{{ sandbox_openshift_api_key }}"
      validate_certs: false
  block:
    - name: Create Instances
      loop: "{{ instances|default([]) }}"
      loop_control:
        loop_var: _instance
      ansible.builtin.include_tasks: create_instance.yaml


    - name: Create services for the nodes
      ansible.builtin.include_tasks: create_services.yaml
      loop: "{{ instances|default([]) }}"
      loop_control:
        loop_var: _instance

    - name: Create routes for the nodes
      ansible.builtin.include_tasks: create_routes.yaml
      loop: "{{ instances|default([]) }}"
      loop_control:
        loop_var: _instance
