---
# The URL comes from the order form. Warn instead of failing so the order
# completes and the author can debug the runner on the bastion.
- name: Warn when field content repository URL is not http(s)
  when: vm_workload_field_content_git_repo_url is not match('^https?://')
  ansible.builtin.debug:
    msg: >-
      WARNING: vm_workload_field_content_git_repo_url should be an http(s) URL,
      got: {{ vm_workload_field_content_git_repo_url }}. The runner will start
      anyway; check its logs on the bastion.

- name: Write runner environment file
  ansible.builtin.copy:
    dest: "{{ vm_workload_field_content_dir }}/env"
    mode: "0600"
    content: |
      GIT_REPO_URL={{ vm_workload_field_content_git_repo_url }}
      GIT_REVISION={{ vm_workload_field_content_git_repo_revision }}
      PLAYBOOK_ENTRYPOINT={{ vm_workload_field_content_playbook }}
      {% if vm_workload_field_content_git_repo_key | default('') | length > 0 %}
      GIT_TOKEN={{ vm_workload_field_content_git_repo_key }}
      {% endif %}

- name: Write runner scripts
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ vm_workload_field_content_dir }}/{{ item.dest }}"
    mode: "0755"
  loop:
    - src: run.sh.j2
      dest: run.sh
    - src: run-in-ee.sh.j2
      dest: run-in-ee.sh

- name: Write field-content systemd unit
  ansible.builtin.template:
    src: field-content.service.j2
    dest: /etc/systemd/system/{{ vm_workload_field_content_service_name }}.service
    mode: "0644"

- name: Pull field content execution environment
  ansible.builtin.command:
    cmd: podman pull {{ vm_workload_field_content_ee_image }}
  register: r_ee_pull
  changed_when: r_ee_pull.rc == 0

- name: Reload systemd and start field-content
  ansible.builtin.systemd:
    name: "{{ vm_workload_field_content_service_name }}"
    state: restarted
    enabled: true
    daemon_reload: true

# Handoff check: the container was created. run.sh does not use --rm, so a
# container that already exited (bad repo, token, or playbook path) still
# exists. Its state is reported but does not fail the order.
- name: Wait until the field-content container exists
  ansible.builtin.command:
    cmd: podman inspect -f {% raw %}'{{.State.Status}}'{% endraw %} field-content
  register: r_field_content_container
  retries: "{{ vm_workload_field_content_running_retries | int }}"
  delay: "{{ vm_workload_field_content_running_delay | int }}"
  until: r_field_content_container.rc == 0
  changed_when: false

- name: Record field-content runner user info
  agnosticd.core.agnosticd_user_info:
    msg:
      - >-
        Field content runner container state at handoff:
        {{ r_field_content_container.stdout | trim }}.
        Check its logs on the bastion with
        'sudo journalctl -u {{ vm_workload_field_content_service_name }}'.
    data:
      field_content_service: "{{ vm_workload_field_content_service_name }}"
      field_content_git_repo: "{{ vm_workload_field_content_git_repo_url }}"
      field_content_playbook: "{{ vm_workload_field_content_playbook }}"
